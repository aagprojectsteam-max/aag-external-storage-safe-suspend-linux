name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.16.6
      - run: ruff check . && ruff format --check .
      - run: make release-acceptance
      - run: python3 scripts/validate_release.py --tag "$GITHUB_REF_NAME"
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f "docs/RELEASE-NOTES-${GITHUB_REF_NAME}.md"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "External Storage Safe Suspend ${GITHUB_REF_NAME}" \
            --notes-file "docs/RELEASE-NOTES-${GITHUB_REF_NAME}.md"
