name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.16.6
      - run: ruff check . && ruff format --check .
      - run: make check
      - run: python3 scripts/privacy_scan.py --root .
      - run: python3 scripts/build_release.py --check-only
