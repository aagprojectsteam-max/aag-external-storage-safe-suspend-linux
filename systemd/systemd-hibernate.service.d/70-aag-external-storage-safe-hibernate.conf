# Plain Hibernate only; ordinary-suspend wiring remains separate.
[Unit]
Requires=aag-external-storage-safe-suspend.service
After=aag-external-storage-safe-suspend.service
OnSuccess=aag-external-storage-safe-hibernate-resume.service
OnFailure=aag-external-storage-safe-hibernate-abort.service

[Service]
ExecStartPre=/usr/local/libexec/aag-safe-suspend hibernate-systemd-pre
ExecStopPost=-/usr/local/libexec/aag-safe-suspend hibernate-systemd-return
