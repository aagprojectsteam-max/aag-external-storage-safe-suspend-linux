# Use pinned device checks, with health separate from long-cycle qualification.
[Service]
ExecStart=
ExecStart=/usr/bin/systemd-inhibit --what=sleep:handle-lid-switch --who=AAG-resume-check --why=Verify-storage-and-modem-before-next-sleep --mode=block /usr/local/libexec/aag-sleep-transaction resume-verify-device
ExecStartPre=
ExecStartPre=/usr/local/libexec/aag-sleep-transaction resume-verify-begin
ExecStopPost=
ExecStopPost=/usr/local/libexec/aag-sleep-transaction resume-verify-terminal
TimeoutStopSec=45s
