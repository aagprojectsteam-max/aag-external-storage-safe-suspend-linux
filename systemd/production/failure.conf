# logind ignores high-level sleep inhibitors for lid handling by default.
# Hold the low-level lid inhibitor during recovery; release it before retry.
[Unit]
OnFailure=
StartLimitIntervalSec=0
[Service]
Type=oneshot
ExecStart=
ExecStart=/usr/bin/systemd-inhibit --what=sleep:handle-lid-switch --who=AAG-sleep-transaction --why=Coalesce-lid-requests-during-owned-recovery --mode=block /usr/local/libexec/aag-sleep-transaction failure-recover --t700-failsafe /usr/local/libexec/aag-t700-auto failsafe
ExecStopPost=
TimeoutStartSec=infinity
TimeoutStopSec=10s
Restart=on-failure
RestartSec=30s
