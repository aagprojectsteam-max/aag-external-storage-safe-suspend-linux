# One transaction owner; accepted V2 storage ExecStart remains unchanged.
[Service]
ExecStartPre=
ExecStartPre=/usr/local/libexec/aag-sleep-transaction begin
ExecStartPost=
ExecStartPost=/usr/local/libexec/aag-sleep-transaction verify-release
ExecStopPost=
ExecStopPost=/usr/local/libexec/aag-sleep-transaction v2-teardown
TimeoutStartSec=8min
TimeoutStopSec=15s
